name: Fetch Data

on:
  push:
    branches: [ main ]
  schedule:
    - cron: '*/1 * * * *'
  workflow_dispatch:

jobs:
  fetch:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v3

      - name: Fetch Game Data
        run: |
          curl -s -H "User-Agent: Mozilla/5.0" -H "Accept: application/json" "https://draw.ar-lottery01.com/WinGo/WinGo_30S/GetHistoryIssuePage.json" -o data.json

      - name: Commit and Push
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add data.json
          git commit -m "Update Data [skip ci]" || exit 0
          git push
