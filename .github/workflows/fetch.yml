name: Fetch Data
on:
  push:
    branches: [ main ]
  schedule:
    - cron: '*/1 * * * *'
  workflow_dispatch:

jobs:
  fetch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v3

      - name: Fetch Data via Proxy
        run: |
          curl -s "https://api.allorigins.win/raw?url=https://draw.ar-lottery01.com/WinGo/WinGo_30S/GetHistoryIssuePage.json" -o data.json

      - name: Commit and Push
        run: |
          git config --global user.name "Bot"
          git config --global user.email "bot@bot.com"
          git add data.json
          git commit -m "Update Data [skip ci]" || exit 0
          git push
